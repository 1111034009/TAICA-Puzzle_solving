<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>懸疑推理社 MYSTERY FILES</title>
<style>
:root{--gold:#e7c98a;--red:#c8202f;--mist:#8fa3c7;--ink:#05070d;--navy:#0b1224;--line:rgba(143,163,199,.25);--u:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#020409;color:#e8edf7;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Hiragino Sans",sans-serif}
.serif{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Hiragino Mincho ProN",serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#0a1224,#020409 70%)}
#topbar{height:46px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px;background:linear-gradient(#0a1020,#070b16);border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.08em;z-index:5;white-space:nowrap;overflow:hidden}
#topbar .case{color:var(--gold);font-size:16px;letter-spacing:.2em}
#topbar .loc::before{content:'◆ ';color:var(--red)}
#hCd{color:#ff7a6a;font-size:13px}
#hCd.on{animation:blink 1.2s infinite}
.ap{display:flex;align-items:center;gap:8px;margin-left:auto}
.ap .lbl{color:var(--mist);font-size:12px}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:15px;background:var(--gold);transform:skewX(-14deg);box-shadow:0 0 6px rgba(231,201,138,.6)}
.pips i.off{background:#27304c;box-shadow:none}
.mbtn,.dbtn,.btn{border:1px solid rgba(231,201,138,.45);background:rgba(10,16,34,.85);padding:6px 14px;font-size:14px;letter-spacing:.1em;transition:.15s;position:relative}
.mbtn:hover,.dbtn:hover,.btn:hover{background:#1b2a52;border-color:var(--gold)}
.btn.pri{background:linear-gradient(90deg,#7a1420,#c8202f);border-color:#ff8a8a}
.btn.pri:hover{filter:brightness(1.2)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
#stagewrap{position:relative;flex:1;min-height:0}
#stage{position:absolute;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 80px #000}
#stage>*{position:absolute}
#bg,#rain,#hot,#chars,#vig,#dark,#flash,#cut{inset:0;width:100%;height:100%}
#bg{z-index:1;transition:opacity .35s}
#rain{z-index:2;pointer-events:none;opacity:.3}
#rain[data-heavy="1"]{opacity:.95 !important;filter:brightness(1.15)}
#hot{z-index:3;pointer-events:none}
#chars{z-index:4;pointer-events:none}
#vig{z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.6));}
#dark{z-index:6;pointer-events:none;opacity:0;transition:opacity 1.5s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(0,0,0,0) 0,rgba(0,0,0,.3) 7%,rgba(0,0,0,.93) 20%)}
#stage.blackout #dark{opacity:1}
#flash{z-index:7;pointer-events:none;background:#bcd4ff;opacity:0}
#cut{z-index:9;pointer-events:none;background:#000;opacity:0;transition:opacity .35s}
#cut.on{opacity:1}
.hs{pointer-events:all;cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><circle cx='13' cy='13' r='9' fill='none' stroke='%23e7c98a' stroke-width='3'/><path d='M20 20L29 29' stroke='%23e7c98a' stroke-width='4'/></svg>") 13 13,pointer}
.hit{fill:rgba(255,255,255,.001);stroke:transparent}
.hs:hover .hit{stroke:rgba(231,201,138,.9);stroke-width:3;stroke-dasharray:10 8;fill:rgba(231,201,138,.1)}
.pulse{fill:none;stroke:rgba(255,236,170,.9);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.dot{fill:#ffe9a8;filter:drop-shadow(0 0 6px #ffd36a)}
.hs.done .ring{fill:none;stroke:rgba(143,163,199,.5);stroke-width:2}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.8);opacity:0}}
@keyframes blink{50%{opacity:.35}}
@keyframes lt{0%,90%{opacity:0}91%{opacity:1}92%{opacity:.1}93%{opacity:1}95%,100%{opacity:0}}
@keyframes lf{0%,90%{opacity:0}91%{opacity:.3}92%{opacity:0}93%{opacity:.35}96%,100%{opacity:0}}
.lt{animation:lt 9s infinite;opacity:0}
.lf{animation:lf 9s infinite;opacity:0}
@keyframes sway{50%{transform:rotate(1.4deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.9}40%{opacity:.6}60%{opacity:1}}
.flick{animation:flick 2.4s infinite}
#tip{z-index:12;pointer-events:none;display:none;padding:3px 12px;background:rgba(5,8,18,.92);border:1px solid var(--gold);font-size:13px;letter-spacing:.1em;transform:translate(14px,-34px);white-space:nowrap}
#banner{z-index:13;left:50%;top:6%;transform:translateX(-50%);pointer-events:none;display:none;padding:10px 40px;background:linear-gradient(90deg,transparent,rgba(120,16,28,.92) 20%,rgba(120,16,28,.92) 80%,transparent);text-align:center;letter-spacing:.2em;min-width:40%}
#banner small{display:block;color:var(--gold);font-size:12px}
#banner b{font-size:20px}
#banner.show{display:block;animation:ban 2.6s forwards}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) translateY(-20px)}12%{opacity:1;transform:translateX(-50%)}85%{opacity:1}100%{opacity:0}}
#dlg{z-index:10;left:4%;right:4%;bottom:3.5%;min-height:21%;padding:1.4% 2.6% 1.6%;background:linear-gradient(180deg,rgba(8,13,28,.88),rgba(4,7,16,.95));border:1px solid rgba(231,201,138,.5);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 10px 40px #000;display:none;cursor:pointer}
#dlg.show{display:block}
#dname{position:absolute;left:2%;top:calc(var(--u)*-2.4);padding:.25em 2em .25em 1.2em;background:linear-gradient(90deg,#8a1420,#c8202f);clip-path:polygon(0 0,100% 0,93% 100%,0 100%);font-weight:700;letter-spacing:.25em;font-size:max(14px,calc(var(--u)*1.7))}
#dtext{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;font-size:max(15px,calc(var(--u)*1.7));line-height:1.75;letter-spacing:.06em;margin-top:.2em;min-height:3.4em}
#dlg.narr #dtext{color:#c4d0ea}
#dnext{position:absolute;right:1.6%;bottom:6%;color:var(--gold);animation:blink 1s infinite}
#dskip{position:absolute;right:1.4%;top:-2.2em;font-size:12px;padding:2px 10px;background:rgba(0,0,0,.7);border:1px solid var(--line);color:var(--mist)}
#dauto,#dlogb{position:absolute;top:-2.2em;font-size:12px;padding:2px 10px;background:rgba(0,0,0,.7);border:1px solid var(--line);color:var(--mist)}
#dauto{right:calc(1.4% + 7.2em)}#dlogb{right:calc(1.4% + 11.6em)}
#dauto.on{color:var(--gold);border-color:var(--gold);background:rgba(60,40,8,.8)}
.ch svg{animation:breath 4.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breath{50%{transform:scaleY(1.009) translateY(-.3%)}}
.hist{margin:5px 0;padding:5px 9px;border-left:2px solid #3a4a78;font-size:13px;line-height:1.65;color:#c4d0ea}
.hist b{color:var(--gold);font-weight:700;margin-right:.6em}.hist.n{color:#8fa0c4;border-left-color:#2a3558;font-style:italic}
.histbox{max-height:46vh;overflow:auto;padding-right:4px}
#choices{z-index:11;left:12%;right:12%;bottom:29%;display:none;flex-direction:column;gap:.55em;max-height:62%;overflow:auto}
#choices.show{display:flex}
.choice{padding:.6em 1.3em;background:rgba(8,14,32,.94);border:1px solid rgba(231,201,138,.5);text-align:left;font-size:max(14px,calc(var(--u)*1.55));letter-spacing:.06em;transition:.15s}
.choice:hover{background:linear-gradient(90deg,#7a1420,#13203f);border-color:var(--gold);transform:translateX(6px)}
.choice.dis{opacity:.4;pointer-events:none}
.choice small{color:var(--gold);margin-left:.8em;font-size:.8em}
.choice.done{opacity:.7}
#choices{scrollbar-width:thin;scrollbar-color:var(--gold) rgba(0,0,0,.35)}
#choices::-webkit-scrollbar{width:8px}#choices::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px}#choices::-webkit-scrollbar-track{background:rgba(0,0,0,.35)}
#choices.low{max-height:84%}
.crow{display:flex;gap:.55em}.crow .choice{flex:1;text-align:center}
.choice.tab{opacity:.7}.choice.tab.on{opacity:1;border-color:var(--gold);background:#1a2650;color:var(--gold)}
.chead{display:block;font-size:.72em;color:var(--gold);letter-spacing:.12em;margin-bottom:.15em}
.choice .ctx{display:block;line-height:1.55}
.tli2{font-size:12.5px;line-height:1.6;color:#c4d0ea;border-left:2px solid var(--gold);padding:1px 0 1px 8px;margin:4px 0}
.evrow .av{border-radius:4px;width:56px;height:56px}
.picked{margin:4px 0 10px;padding:8px 10px;border:1px dashed var(--gold);font-size:13px;line-height:1.7;color:#e8edf7}
.portrait #dlg{position:fixed;left:6px;right:6px;bottom:62px;min-height:0;font-size:14px;z-index:40}
.portrait #dname{top:-28px;font-size:14px}
.portrait #dtext{font-size:15px}
.portrait #choices{position:fixed;left:8px;right:8px;z-index:41}
.ch{position:absolute;bottom:0;aspect-ratio:500/820;transform:translateX(-50%);transition:left .4s,height .4s,filter .3s}
.ch svg{width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(0,0,0,.85))}
.ch.dim{filter:brightness(.5) saturate(.7)}
.ch.enter{animation:chin .45s ease-out}
@keyframes chin{from{opacity:0;margin-bottom:-30px}to{opacity:1;margin-bottom:0}}
#dock{height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(#070b16,#0a1020);border-top:1px solid var(--line);z-index:5;overflow-x:auto;white-space:nowrap}
.dbtn.on{background:#1b2a52;border-color:var(--gold);color:var(--gold)}
.sep{flex:1}
.badge{position:absolute;right:-6px;top:-8px;background:var(--red);font-size:11px;min-width:18px;height:18px;border-radius:9px;line-height:18px;text-align:center;padding:0 4px}
.dbtn.pulse2{animation:glow 1s 3}
@keyframes glow{50%{box-shadow:0 0 18px var(--gold)}}
#panel,#modal{position:fixed;inset:46px 0 58px 0;display:none;z-index:30;background:rgba(2,4,10,.8);backdrop-filter:blur(5px);align-items:center;justify-content:center}
#modal{z-index:70;inset:0}
#panel.show,#modal.show{display:flex}
.pwin{width:min(1180px,97vw);height:min(790px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#0d1630,#070c1a);border:1px solid rgba(231,201,138,.4);box-shadow:0 0 60px #000}
.pwin.small{height:auto;width:min(560px,94vw)}
.phead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.ptitle{font-size:20px;letter-spacing:.2em;color:var(--gold)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{padding:5px 14px;border:1px solid var(--line);font-size:14px;letter-spacing:.1em}
.tab.on{background:#1b2a52;border-color:var(--gold);color:var(--gold)}
.pclose{margin-left:auto;font-size:22px;width:34px;height:34px;border:1px solid var(--line)}
.pclose:hover{background:var(--red)}
.pbody{flex:1;overflow:auto;padding:14px 16px;min-height:0}
.cols{display:flex;gap:16px;height:100%}
.col-l{flex:1.15;overflow:auto;min-width:0}
.col-r{flex:1;overflow:auto;border-left:1px solid var(--line);padding-left:16px;min-width:0}
@media(max-width:800px){.cols{flex-direction:column;height:auto}.col-r{border:0;padding:0}.col-l,.col-r{overflow:visible}}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ecard{background:#0a1226;border:1px solid #2a3a62;padding:6px;cursor:pointer;position:relative;transition:.15s}
.ecard:hover{border-color:var(--gold)}
.ecard.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(231,201,138,.4)}
.ecard .ic{background:#05080f}
.ecard .ic svg{width:100%;height:auto}
.ecard .nm{font-size:13px;margin-top:4px;letter-spacing:.05em}
.ecard .st{font-size:11px;color:var(--mist)}
.ecard .st.ok{color:#7fe0b0}
.tag{display:inline-block;padding:1px 9px;margin:2px 4px 2px 0;border:1px solid var(--line);font-size:12px;color:var(--mist)}
.tag.red{border-color:#c8202f;color:#ff9a9a}
h3{font-size:17px;letter-spacing:.12em;color:var(--gold);margin:6px 0}
h4{font-size:14px;letter-spacing:.1em;color:var(--mist);margin:12px 0 4px}
p.d{font-size:14px;line-height:1.8;letter-spacing:.04em;color:#d5dcec;margin:6px 0}
.big svg{width:100%;max-width:360px;height:auto;margin:0 auto;border:1px solid var(--line)}
.tq{display:flex;gap:10px;align-items:center;background:#0a1226;border:1px solid #2a3a62;padding:8px;margin-bottom:8px;cursor:pointer}
.tq.sel,.tq:hover{border-color:var(--gold)}
.tq .av{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;background:#162244;border:1px solid var(--line)}
.tq .av svg{width:100%;height:100%}
.tq .tx{font-size:14px;line-height:1.6}
.tq .who{font-size:12px;color:var(--gold)}
.slots{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}
.slot{flex:1;min-height:64px;border:1px dashed var(--mist);padding:8px;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.5}
.slot.fill{border-style:solid;border-color:var(--gold);background:#10193a}
.vs{align-self:center;color:var(--red);font-weight:700}
.rslt{border-left:5px solid var(--mist);background:#0a1226;padding:10px 14px;margin-top:10px;font-size:14px;line-height:1.8}
.rslt b{letter-spacing:.2em;display:block;margin-bottom:4px}
.rslt.contradict{border-color:#e0303f}.rslt.contradict b{color:#ff7a86}
.rslt.support{border-color:#3fd0a0}.rslt.support b{color:#7fe0b0}
.rslt.supplement{border-color:#e0a83a}.rslt.supplement b{color:#f0c46a}
.rslt.unknown{border-color:#6a7488}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:#0a1226;border:1px solid #2a3a62;display:flex;flex-direction:column}
.pcard .pf{height:190px;overflow:hidden;background:linear-gradient(#17254a,#0a1226);display:flex;justify-content:center}
.pcard .pf svg{height:100%;width:auto}
.pcard .pi{padding:10px;font-size:13px;line-height:1.6;flex:1}
.pcard .pn{font-size:17px;letter-spacing:.15em;color:var(--gold)}
.pcard .pi b{color:var(--mist);font-weight:400}
.tl{display:flex;flex-direction:column;gap:6px}
.tli{display:flex;align-items:center;gap:10px;background:#0a1226;border:1px solid #2a3a62;padding:8px 10px}
.tli.unk{opacity:.7;border-style:dashed}
.tli .no{width:26px;height:26px;border-radius:50%;background:#1b2a52;text-align:center;line-height:26px;flex:none;font-size:13px}
.tli .tm{width:84px;flex:none;color:var(--gold);font-size:13px}
.tli .tt{flex:1;font-size:14px;line-height:1.5}
.tli .mv{display:flex;flex-direction:column;gap:2px}
.tli .mv button{width:30px;height:20px;border:1px solid var(--line);font-size:11px;line-height:1}
.tli .mv button:hover{background:var(--red)}
.tli.ok{border-color:#3fd0a0}
.tli.bad{border-color:#e0303f}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.opt{border:1px solid #2a3a62;background:#0a1226;padding:8px 10px;font-size:13px;line-height:1.5;text-align:left;transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.on{border-color:var(--gold);background:#1a2650;box-shadow:inset 0 0 0 1px var(--gold)}
.opt.face{display:flex;gap:8px;align-items:center}
.opt.face .av{width:48px;height:48px;border-radius:50%;overflow:hidden;background:#162244;flex:none}
.opt.face .av svg{width:100%;height:100%}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #2a3a62;background:#0a1226;padding:4px 10px;margin:3px;font-size:13px}
.chip.on{border-color:var(--gold);background:#1a2650}
.hintbox{border:1px solid #2a3a62;background:#0a1226;padding:12px 14px;margin-bottom:10px}
.hintbox.lock{opacity:.6}
.hintbox .ht{display:flex;justify-content:space-between;align-items:center;font-size:15px;letter-spacing:.1em;color:var(--gold)}
.hintbox .hb{margin-top:8px;font-size:14px;line-height:1.8;color:#dfe7f7}
.bar{height:8px;background:#1a2340;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b3202a,#e7c98a)}
#inspect{position:fixed;inset:46px 0 58px 0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.7);backdrop-filter:blur(4px)}
#inspect.show{display:flex;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.iwin{width:min(900px,95vw);display:flex;gap:0;background:linear-gradient(180deg,#0d1630,#070c1a);border:1px solid var(--gold);box-shadow:0 0 70px #000,0 0 30px rgba(231,201,138,.2);max-height:100%;overflow:auto;position:relative}
.iwin .il{flex:1;background:#05080f;padding:14px;display:flex;align-items:center;justify-content:center;min-width:0}
.iwin .il svg{width:100%;max-width:340px;height:auto;animation:zoomin .5s ease-out}
@keyframes zoomin{from{transform:scale(.6);opacity:0}}
.iwin .ir{flex:1.2;padding:18px 20px;min-width:0}
.iwin .nw{position:absolute;left:0;top:0;background:var(--red);padding:2px 16px;font-size:13px;letter-spacing:.2em;z-index:2}
.note{border-left:3px solid var(--mist);padding:4px 10px;margin:10px 0;font-size:13px;color:#aab8d6;line-height:1.7;font-style:italic}
@media(max-width:700px){.iwin{flex-direction:column}}
#title{position:fixed;inset:0;z-index:50;background:#020409;display:flex;align-items:flex-end;overflow:hidden}
#title .tbg{position:fixed;inset:0;width:100%;height:100%}
#title.sel{align-items:center;overflow:auto}
#title.sel .tcontent{background:linear-gradient(0deg,rgba(2,4,9,.92),rgba(2,4,9,.8));padding:4vh 5vw;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.csh{font-size:min(7vw,34px);letter-spacing:.2em;color:var(--gold);margin:4px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;max-width:1100px}
.ccard{border:1px solid rgba(231,201,138,.35);background:rgba(8,13,28,.92);display:flex;flex-direction:column;box-shadow:0 10px 40px #000}
.cth{aspect-ratio:16/9;overflow:hidden;position:relative;background:#05070d}
.cth svg{width:100%;height:100%}
.cinfo{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.cinfo .ck{font-size:12px;letter-spacing:.3em;color:var(--mist)}
.cinfo h3{font-size:22px;letter-spacing:.12em;color:#fff}
.cinfo p{font-size:14px;color:#c4d0ea}
.cinfo .cm{font-size:12px;color:var(--gold);letter-spacing:.08em}
.cinfo .btn{align-self:flex-start;margin-top:6px}
#title .tbg svg{width:100%;height:100%}
#title .tcontent{position:relative;z-index:3;padding:0 6vw 7vh;width:100%;background:linear-gradient(0deg,rgba(2,4,9,.95),rgba(2,4,9,.55) 60%,transparent)}
.tsub{letter-spacing:.5em;color:var(--mist);font-size:max(12px,1.2vw)}
#title h1{font-size:min(11vw,9.5vh);letter-spacing:.12em;line-height:1.1;text-shadow:0 0 30px rgba(200,32,47,.5),0 4px 20px #000}
#title h1 em{font-style:normal;color:var(--red)}
.tEn{letter-spacing:.7em;font-size:min(3vw,3.2vh);color:var(--gold);margin:4px 0 22px}
.tmenu{display:flex;gap:14px;flex-wrap:wrap}
.tmenu .btn{font-size:18px;padding:10px 34px}
#result{position:fixed;inset:0;z-index:60;display:none;overflow:auto;background:rgba(2,4,10,.9);backdrop-filter:blur(4px)}
#result.show{display:block}
.rwrap{max-width:1000px;margin:0 auto;padding:30px 16px 60px}
.rtitle{font-size:min(8vw,46px);letter-spacing:.2em;text-align:center;color:var(--gold)}
.rscore{display:flex;gap:20px;align-items:center;justify-content:center;margin:14px 0;flex-wrap:wrap}
.rscore .num{font-size:72px;font-weight:700;color:#fff}
.rscore .rk{font-size:60px;color:var(--red);border:3px solid var(--red);width:90px;height:90px;text-align:center;line-height:84px}
.rbox{border:1px solid #2a3a62;background:#0a1226;padding:12px 16px;margin:14px 0}
.rbox h3{margin-top:0}
.noise{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}

#quick{display:none}
.portrait #stagewrap{flex:none;height:calc(100vw*9/16)}
.portrait #quick{display:flex;flex:1;min-height:0;overflow:auto;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 12px;background:linear-gradient(#050810,#070b16)}
.portrait #quick .qh{width:100%;font-size:12px;color:var(--mist);letter-spacing:.12em}
.portrait #quick .qb{flex:1 1 42%;min-height:44px;padding:8px 10px;border:1px solid rgba(231,201,138,.45);background:rgba(10,16,34,.9);font-size:14px;text-align:left}
.portrait #quick .qb.new{border-color:var(--gold);color:var(--gold)}
.portrait #quick .qb.done{opacity:.55}
.portrait #quick .qb small{display:block;font-size:11px;color:var(--mist)}
.portrait #dock{height:auto;flex-wrap:wrap;overflow:visible;padding:8px;gap:6px}
.portrait #dock .dbtn{padding:8px 10px;font-size:13px;letter-spacing:.04em;flex:1 1 auto;min-height:40px}
.portrait #dock .sep{display:none}
.portrait #topbar{height:auto;flex-wrap:wrap;gap:2px 10px;padding:5px 10px;font-size:12px;white-space:normal;overflow:visible}
.portrait #topbar .case{order:0;flex:1 1 auto;font-size:14px;letter-spacing:.08em}
.portrait #bMenu{order:1;margin-left:auto;padding:4px 12px}
.portrait #topbar::after{content:'';order:2;flex-basis:100%;height:0}
.portrait #topbar .loc,.portrait #topbar #hCd,.portrait #topbar .ap{order:3}
.portrait #topbar .ap{margin-left:auto}
.portrait .pips{display:none}
.portrait #dlg{bottom:150px}
.portrait #choices{bottom:260px}
@media(prefers-reduced-motion:reduce){.lt,.lf,.sway,.pulse{animation:none}}
</style>
</head>

  <div id="topbar">
    <div class="case serif" id="hCase">霧鴉館 ‧ 暴風雨之夜</div>

    <div id="hCd"></div>
    <div class="ap"><span class="lbl">行動點</span><span class="pips" id="hPips"></span><b id="hAp">20</b></div>
    <button class="mbtn" id="bSnd" title="音效開關（M）">音效：開</button>
    <button class="mbtn" id="bMenu">選單</button>
  </div>
  <div id="stagewrap">
    <div id="stage">
      <div id="bg"></div>
      <svg id="rain" viewBox="0 0 1600 900" preserveAspectRatio="none"></svg>

    </div>
  </div>
  <div id="quick"></div>

</div>

 const h=m[0]*sc,b=m[1]*sc;
 const top=`M${cx-w} ${cy} C${cx-w} ${cy-h*1.25} ${cx+w} ${cy-h*1.25} ${cx+w} ${cy}`;
 const shape=top+` C${cx+w} ${cy+b*1.25} ${cx-w} ${cy+b*1.25} ${cx-w} ${cy}Z`;
 const ir=(st==='wide'?14:17)*(sc<1?.92:1),pr=st==='wide'?4.5:(st==='cold'?5.5:8.5),off=st==='sad'?4:(st==='cold'?-2:0);

function brow(cx,cy,ex,s,col,thick){

 let t=T[ex];
 if(ex==='doubt')t=s===-1?[by-6,by-22,by-6]:[by+8,by-2,by-2];
 t=t||T.normal;
 const q=t[1]*2-(t[0]+t[2])/2,tk=thick||1;
 // tapered brow: thick at the inner end, thin at the tip
 return `<path d="M${inn} ${t[0]-3*tk} Q${cx} ${q-4*tk} ${out} ${t[2]} Q${cx} ${q+3*tk} ${inn} ${t[0]+3.5*tk}Z" fill="${col}" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>`;
}

   {id:'pills',label:'老爺的藥',cost:0,lines:[['mio','normal','聽說老爺在服用鎮靜劑？'],['hina','normal','是的，氷室醫師開的。藥盒由我每週整理一次，放進一週份。'],['hina','nervous','啊……但我只負責整理，老爺吃不吃，我就不清楚了。']],gives:['t_hina3']},
   {id:'past',label:'來到鷹宮家的經過',cost:0,lines:[['mio','normal','你在這裡工作多久了？'],['hina','smile','三年了。老爺雖然嚴厲，卻是個照顧下人的人。'],['mio','doubt','（笑容無可挑剔……反而讓人在意。）']]}
  ],
  present:{

   t_sayo2:{cost:1,lines:[['mio','normal','紗夜說，21 點 20 分她在二樓走廊看到你的背影，往書房的方向走。'],['hina','surprise','！……啊，是的。我上去看過一眼，想收老爺的杯子。'],['hina','nervous','老爺趴在桌上，我以為他睡著了，就沒有打擾……所以才沒說。']],gives:['t_hina4']},
   e_freezer:{cost:1,lines:[['mio','normal','冷凍庫的冰球，四顆只剩一顆。你說只用了一顆。'],['hina','nervous','……大概是我記錯了。或許是廚房裡別人拿去用的。'],['hina','normal','我不覺得，這跟老爺的死有什麼關係。']]},
   e_towel:{cost:1,lines:[['mio','doubt','暖爐灰燼裡，有條廚房用的濕毛巾。你說你只是看了一眼？'],['hina','nervous','毛巾……是我之前擦桌子時留下的吧。'],['hina','cold','……請不要把每件小事都當成證據，澪小姐。']]},
   e_pillbox:{cost:1,lines:[['mio','normal','藥盒裡，明天起三天份的藥不見了。'],['hina','nervous','我、我是想老爺常常忘記，所以提早備好……'],['mio','doubt','（解釋得通……但太巧了。）']]},
   e_clip:{cost:1,lines:[['mio','normal','這則剪報，是老爺抽屜裡留下的。'],['hina','cold','……十五年前的舊報紙而已。'],['hina','normal','和我有什麼關係呢？']]},
   e_locker:{cost:1,lines:[['mio','doubt','你姓春日，但這張照片背面寫著「爸爸與雛，工坊前」。招牌是長谷川工坊。'],['hina','cold','……那是我的私人物品。請您不要擅自翻我的櫃子。'],['hina','sad','（她握緊圍裙的邊緣，指節泛白。）']]},
   e_bolt:{neutral:1,lines:[['hina','normal','機關之類的事，我是不懂的。']]},
   e_puddle:{neutral:1,lines:[['hina','normal','那裡漏水很久了，老爺一直不肯修。']]},

 sayo:{intro:[['sayo','sad','……澪學姐。有問題的話，儘管問吧。']],
  topics:[
   {id:'act',label:'昨晚的行動',cost:0,lines:[['mio','normal','紗夜，晚餐之後你在哪？'],['sayo','normal','我回房間，戴著耳機畫畫。大概到 22 點 05 分，我想再跟爺爺談一次，就去敲書房的門。'],['sayo','sad','轉了門把，打不開——門從裡面鎖死了。我叫了他好幾聲，沒人回應。我以為他還在生氣……']],gives:['t_sayo1']},

   {id:'corridor',label:'21 點 20 分前後',cost:1,lines:[['mio','normal','紗夜，21 點 20 分左右，你離開過房間嗎？'],['sayo','normal','嗯……我去了洗手間。在走廊轉角，我看見雛小姐的背影。'],['sayo','normal','她往書房的方向走，手上用毛巾包著什麼，好像很冰，一直換手拿。']],gives:['t_sayo2']}

 kuga:{intro:[['kuga','normal','有何貴幹？我是遵紀守法的律師，請注意措辭。']],
  topics:[
   {id:'act',label:'昨晚的行動',cost:0,lines:[['mio','normal','久我先生，晚餐後你的行動？'],['kuga','normal','我在大廳打了一通電話給事務所，大約 21 點 20 分到 21 點 50 分。'],['kuga','normal','之後我上二樓想談遺囑的事。敲了書房門，老爺隔著門說「明天再談」，我就回來了。']],gives:['t_kuga1']},
   {id:'will',label:'遺囑修訂的事',cost:0,lines:[['mio','normal','老爺宣布要修改遺囑，你怎麼看？'],['kuga','normal','他打算把收藏全數捐給市立博物館。身為顧問律師，我只能依委託人的意願辦理。'],['kuga','doubt','……你該不會覺得，我會為此殺人吧？']]}

   t_himu1:{cost:1,confess:1,lines:[['mio','doubt','氷室醫師推定，老爺 21 點 30 分前就死了。你卻說 21 點 50 分他隔門回話。'],['kuga','surprise','……！'],['kuga','nervous','……好吧。21 點 50 分，書房的門沒有鎖。老爺趴在桌上，我以為他睡著了。'],['kuga','nervous','我拿走了遺囑修訂草稿，然後關門離開。我怕被懷疑，才說謊的。']],gives:['t_kuga2']},
   e_briefcase:{cost:1,confess:1,lines:[['mio','normal','你的公事包裡，有一份角落沾著墨漬的遺囑草稿。和書桌的資料夾吻合。'],['kuga','surprise','……！'],['kuga','nervous','……被你發現了。21 點 50 分，書房的門沒有鎖，老爺趴在桌上。'],['kuga','nervous','我以為他睡著了，就拿走草稿離開。我怕被當成嫌疑人，才說謊。']],gives:['t_kuga2']},
   e_phone:{neutral:1,lines:[['mio','normal','通話紀錄顯示你 21 點 48 分才掛電話。'],['kuga','normal','所以我才說 21 點 50 分前後去敲門。時間都對得上，不是嗎？']]}

  topics:[
   {id:'act',label:'昨晚的行動',cost:0,lines:[['mio','normal','黑澤先生，晚餐後呢？'],['kuro','normal','我和氷室醫師在大廳下將棋，九點過一點下到十點，一步都沒離開過。'],['kuro','smile','嘿，他可是棋下得又慢又陰險的傢伙。']],gives:['t_kuro1']},

/* ===================== GAME_STATE ===================== */
function newState(){
 return {screen:'title',scene:D.startScene,ap:D.AP_MAX,apSpent:0,found:[],tests:[],facts:{},compared:{},
  asked:{},presented:{},hints:{},timeline:D.tlStart.slice(),tlChecked:false,
  wrong:0,blackout:false,acc:{culprit:null,motive:null,method:null,ev:[]},result:null,compareLog:[],revealed:false};
}
const CASES={kiri:buildKiri(),snow:buildSnow()};
let D=CASES.kiri;
let GAME_STATE=newState();
const hasE=id=>GAME_STATE.found.includes(id);
const hasT=id=>GAME_STATE.tests.includes(id);
const hasF=id=>!!GAME_STATE.facts[id];
const has=id=>hasE(id)||hasT(id);
const KS={e:hasE,t:hasT,f:hasF};
const itemInfo=id=>D.evidence[id]?{kind:'e',name:D.evidence[id].name,loc:D.evidence[id].loc}:{kind:'t',name:'證詞：'+D.chars[D.tests[id].who].name,who:D.chars[D.tests[id].who].name,text:D.tests[id].text};
const itemLine=id=>{const i=itemInfo(id);return i.kind==='t'?i.who+'的證詞「'+i.text+'」':'證物「'+i.name+'」';};
const shortDesc=(t,n)=>{const f=String(t).split('。')[0];return f.length>n?f.slice(0,n)+'…':f+'。';};
const pairKey=(a,b)=>[a,b].sort().join('|');

/* ===================== SCORING ===================== */
const SCORING={
 timelineScore(order){
  const idx=id=>D.trueTimeline.indexOf(id);let ok=0,tot=0;
  for(let i=0;i<order.length;i++)for(let j=i+1;j<order.length;j++){tot++;if(idx(order[i])<idx(order[j]))ok++;}
  return tot?ok/tot:0;
 },
 positions(order){return order.filter((id,i)=>D.trueTimeline[i]===id).length;},
 violated(order){
  const pos=id=>order.indexOf(id);
  return D.constraints.filter(c=>pos(c[0])>pos(c[1]));
 },
 evaluate(){
  const g=GAME_STATE,a=g.acc,S=D.solution;
  const culpritOK=a.culprit===S.culprit,motiveOK=a.motive===S.motive,methodOK=a.method===S.method;
  const groups=D.groups.map(gr=>({id:gr.id,label:gr.label,ok:gr.ids.filter(i=>a.ev.includes(i)).length>=gr.need}));
  const gc=groups.filter(x=>x.ok).length;
  const hr=a.ev.filter(i=>D.herrings.includes(i)).length;
  const evScore=Math.max(0,Math.round(gc/D.groups.length*25-hr*2));
  const tlRatio=SCORING.timelineScore(g.timeline);
  const tlScore=Math.round(tlRatio*20);
  const reasoning=(culpritOK?16:0)+(motiveOK?12:0)+(methodOK?12:0);
  const effAp=Math.round(g.ap/D.AP_MAX*10);
  const effW=g.wrong<=0?5:g.wrong<=2?3:g.wrong<=4?1:0;
  const eff=Math.min(15,effAp+effW);
  let total=reasoning+evScore+tlScore+eff;
  if(!culpritOK)total=Math.min(total,45);
  let kind;
  if(!culpritOK)kind='wrong';
  else if(motiveOK&&methodOK&&gc>=D.groups.length-1&&tlRatio>=0.6)kind='true';
  else if(gc>=2||methodOK||motiveOK)kind='partial';
  else kind='insuff';
  if(kind==='true')total=Math.max(total,75);
  total=Math.max(0,Math.min(100,total));
  const rank=total>=90?'S':total>=80?'A':total>=65?'B':total>=45?'C':'D';
  return {culpritOK,motiveOK,methodOK,groups,gc,hr,evScore,tlRatio,tlScore,reasoning,eff,total,rank,kind};
 }
};

/* ===================== ACTIONS ===================== */
const ACTIONS={
 spend(n){
  const g=GAME_STATE;g.ap=Math.max(0,g.ap-n);g.apSpent+=n;
  RENDER.header();
 },
 canSpend(n){return GAME_STATE.ap>=n;},
 addEvidence(id){
  if(hasE(id))return false;
  GAME_STATE.found.push(id);RENDER.badge();RENDER.banner('線索入手',D.evidence[id].name);SND.sfx('found');RENDER.pulseDock('bEv');return true;
 },
 addTestimony(id){
  if(hasT(id))return false;
  GAME_STATE.tests.push(id);RENDER.badge();RENDER.banner('取得證詞',D.chars[D.tests[id].who].name+'的證詞');SND.sfx('found');RENDER.pulseDock('bEv');return true;
 },
 addFact(id){
  if(!id||GAME_STATE.facts[id])return false;
  GAME_STATE.facts[id]=true;
  if(id===D.revealFact&&!GAME_STATE.revealed){GAME_STATE.revealed=true;RENDER.queue(()=>RENDER.cutscene(D.reveal,()=>{RENDER.enterScene(GAME_STATE.scene);}));}
  return true;
 },
 compare(a,b){
  const k=pairKey(a,b),g=GAME_STATE;
  const p=D.PAIRS[k];
  if(!p)return {type:'unknown',text:'暫時看不出這兩者之間有什麼關聯。也許需要先取得更多線索，或換一個組合。',fresh:false};
  const fresh=!g.compared[k];
  g.compared[k]=p.type;
  if(fresh&&p.fact)ACTIONS.addFact(p.fact);
  return {type:p.type,text:p.text,fresh,fact:p.fact};
 },
 isAnalyzed(id){return Object.keys(GAME_STATE.compared).some(k=>k.split('|').includes(id));},
 inspect(o){
  const g=GAME_STATE;
  if(!o.ev){RENDER.dialog([['n','',o.flav]]);return;}
  if(hasE(o.ev)){RENDER.inspect(o.ev,false);return;}
  if(!ACTIONS.canSpend(1)){RENDER.dialog([['n','','行動點已經耗盡。你已無法深入調查新的地方——但仍可整理證據、比對、排列時間線，並做出指認。']]);return;}
  ACTIONS.spend(1);ACTIONS.addEvidence(o.ev);RENDER.inspect(o.ev,true);
 },
 checkEvents(){
  const g=GAME_STATE;
  if(!g.blackout&&g.apSpent>=D.BLACKOUT_AT){
   g.blackout=true;RENDER.setBlackout(true);
   RENDER.cutscene(D.blackoutScript,()=>{RENDER.enterScene(g.scene);});
   return true;
  }
  return false;
 },
 talkTopic(cid,t){
  const g=GAME_STATE,key=cid+':'+t.id;
  const first=!g.asked[key];
  if(first&&t.cost>0){
   if(!ACTIONS.canSpend(t.cost)){RENDER.talkMsg('行動點不足，無法深入質問這個話題。');return;}
   ACTIONS.spend(t.cost);
  }
  g.asked[key]=true;

   o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);

   src.buffer=nbuf;fl.type=filt;fl.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
   src.connect(fl);fl.connect(g);g.connect(master);src.start(t0);src.stop(t0+dur+.05);}catch(e){}

   const src=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
   src.buffer=nbuf;src.loop=true;

   const chords=kind==='rain'?[[110,164.8,220],[87.3,130.8,174.6],[98,146.8,196],[82.4,123.5,164.8]]:[[98,146.8,196],[110,164.8,220],[87.3,130.8,174.6],[92.5,138.6,185]];

  tick(){tone(880+Math.random()*120,0,.03,'triangle',.018);},
  ui(){tone(620,0,.07,'sine',.07);tone(930,.03,.08,'sine',.05);},
  found(){[660,880,1318].forEach((f,i)=>tone(f,i*.09,.35,'sine',.11));},

  on:()=>on,

 h+=`<div class="rbox"><h3>推理評分</h3>${bar('推理正確度（犯人・動機・方法）',res.reasoning,40)}${bar('證據完整度',res.evScore,25)}${bar('時間線正確度',res.tlScore,20)}${bar('調查效率',res.eff,15)}<p class="d">你的指認：${esc(D.chars[g.acc.culprit].name)}／${esc(D.motives.find(m=>m.id===g.acc.motive).t)}／${esc(D.methods.find(m=>m.id===g.acc.method).t)}</p></div>`;
 h+=`<div class="rbox"><h3>正確解答</h3><p class="d"><b>犯人：</b>${esc(D.answer.culprit)}<br><b>動機：</b>${esc(mo)}。${esc(D.answer.motiveExtra)}<br><b>方法：</b>${esc(me)}。${esc(D.answer.methodExtra)}</p></div>`;
 h+=`<div class="rbox"><h3>真實時間線</h3><div class="tl">${D.trueTimeline.map((id,i)=>{const ev=D.timeline.find(t=>t.id===id);return `<div class="tli ${g.timeline[i]===id?'ok':''}"><div class="no">${i+1}</div><div class="tm">${ev.time}</div><div class="tt">${esc(ev.text)}</div></div>`;}).join('')}</div><p class="d" style="color:#8fa3c7">綠框表示你的排列與真相位置相同（順序關係正確率 ${Math.round(res.tlRatio*100)}%）。</p></div>`;
 h+=`<div class="rbox"><h3>關鍵證據鏈</h3>${res.groups.map(gr=>{const def=D.groups.find(x=>x.id===gr.id);return `<div class="rslt ${gr.ok?'support':'contradict'}" style="margin:6px 0"><b>${gr.ok?'✔ 已建立':'✘ 缺漏'}</b>${esc(gr.label)}　<small>（${esc(def.hint)}）</small></div>`;}).join('')}</div>`;
 h+=`<div class="rbox"><h3>你漏掉的線索</h3>${missE.length||missT.length?`<p class="d">${missE.map(id=>esc(D.evidence[id].name)+'（'+esc(D.evidence[id].loc)+'）').join('、')}${missE.length&&missT.length?'；':''}${missT.map(id=>'證詞：'+esc(D.chars[D.tests[id].who].name)+'「'+esc(D.tests[id].text.slice(0,16))+'…」').join('、')}</p>`:'<p class="d">你找齊了所有線索。</p>'}</div>`;
 h+=`<div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="btn pri" data-r="again" style="font-size:18px;padding:10px 34px">重新開始本案件</button><button class="btn" data-r="title" style="font-size:18px;padding:10px 34px">返回標題</button></div></div>`;
 const r=$('#result');r.innerHTML=h;r.scrollTop=0;r.classList.add('show');
}
/* ---- 標題 ---- */
function showTitle(){
 hideDialog();setCast([]);closePanel(true);$('#modal').classList.remove('show');$('#result').classList.remove('show');$('#inspect').classList.remove('show');
 GAME_STATE=newState();RENDER.setBlackout(false);MODE='title';RENDER.updateHot();
 const t=$('#title');t.style.display='flex';t.classList.remove('sel');t.scrollTop=0;
 t.innerHTML=`<div class="tbg">${ART.scene('title')}</div><svg class="tbg" viewBox="0 0 1600 900" preserveAspectRatio="none" style="opacity:.45;pointer-events:none">${ART.rainSVG(90,5)}</svg><div class="tcontent"><div class="tsub">兩樁懸疑事件，等待你的推理</div><h1 class="serif">懸疑<em>／</em>推理社</h1><div class="tEn serif">MYSTERY FILES</div><div class="tmenu"><button class="btn pri" data-t="start">開始調查</button><button class="btn" data-t="file">案件檔案</button><button class="btn" data-t="end">遊戲結束</button></div></div>`;
 RENDER.header();RENDER.badge();
}
function showCaseSelect(mode){
 const t=$('#title');t.classList.add('sel');t.scrollTop=0;
 const cards=Object.keys(CASES).map(id=>{const c=CASES[id];return `<div class="ccard"><div class="cth">${ART.scene(c.thumb)}</div><div class="cinfo"><div class="ck">${esc(c.kind)}</div><h3 class="serif">${esc(c.title)}</h3><p>${esc(c.tagline)}</p><div class="cm">登場人物 ${c.cast5.length}　線索 ${Object.keys(c.evidence).length}　難度 ${c.diff}</div><button class="btn pri" data-case="${id}" data-mode="${mode}">${mode==='file'?'查看案件檔案':'調查此案'}</button></div></div>`;}).join('');
 t.querySelector('.tcontent').innerHTML=`<div class="tsub">SELECT CASE</div><h2 class="serif csh">${mode==='file'?'選擇要查看的案件檔案':'選擇案件'}</h2><div class="cards">${cards}</div><div class="tmenu" style="margin-top:16px"><button class="btn" data-t="back">返回</button></div>`;
}
function pickCase(id,mode){
 if(mode==='file'){caseFile(id);return;}
 D=CASES[id];GAME_STATE=newState();RENDER.setBlackout(false);
 RENDER.startGame();
}
function endScreen(){
 const m=$('#modal');
 m.innerHTML=`<div class="pwin small"><div class="phead"><div class="ptitle serif">GAME OVER</div></div><div class="pbody"><p class="d">感謝您的遊玩。真相，永遠在夜色的另一端等著你。</p><div style="text-align:right;margin-top:12px"><button class="btn pri" data-m="ok">返回標題</button></div></div></div>`;
 m.classList.add('show');m.onclick=e=>{const t=e.target.closest('[data-m]');if(t){m.classList.remove('show');m.onclick=null;}};
}
/* ---- 事件繫結與啟動 ---- */
function bindAll(){
 $('#stage').addEventListener('click',e=>{
  if(DLG.active&&!DLG.choices){advance();return;}
 });
 $('#dskip').addEventListener('click',e=>{e.stopPropagation();skipDialog();});
 $('#dauto').addEventListener('click',e=>{e.stopPropagation();setAuto(!AUTO);});
 $('#dlogb').addEventListener('click',e=>{e.stopPropagation();showHist();});
 $('#bSnd').addEventListener('click',()=>{SND.prime();const o=SND.toggle();$('#bSnd').textContent='音效：'+(o?'開':'關');});
 document.addEventListener('pointerdown',e=>{SND.prime();if(e.target.closest&&e.target.closest('.choice,.dbtn,.btn,.opt,.tq,.mbtn,.pcard,[data-act]'))SND.sfx('ui');},true);
 $('#hot').addEventListener('click',e=>{
  if(MODE!=='explore'||DLG.active)return;
  const g=e.target.closest('.hs');if(!g)return;
  const o=D.scenes[GAME_STATE.scene].objects.find(x=>x.id===g.dataset.id);if(o)ACTIONS.inspect(o);
 });
 $('#quick').addEventListener('click',e=>{
  const b=e.target.closest('[data-q]');if(!b||MODE!=='explore'||DLG.active||panelOpen()||inspectOpen())return;
  const o=D.scenes[GAME_STATE.scene].objects.find(x=>x.id===b.dataset.q);if(o)ACTIONS.inspect(o);
 });
 $('#stage').addEventListener('mousemove',e=>{
  const r=$('#stage').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const st=$('#stage').style;st.setProperty('--mx',(x/r.width*100)+'%');st.setProperty('--my',(y/r.height*100)+'%');
  const g=e.target.closest&&e.target.closest('.hs'),tip=$('#tip');
  if(g&&MODE==='explore'&&!DLG.active){tip.style.display='block';tip.style.left=x+'px';tip.style.top=y+'px';tip.textContent=g.dataset.name;}else tip.style.display='none';
 });
 $('#stage').addEventListener('touchmove',e=>{const t=e.touches[0],r=$('#stage').getBoundingClientRect(),st=$('#stage').style;st.setProperty('--mx',((t.clientX-r.left)/r.width*100)+'%');st.setProperty('--my',((t.clientY-r.top)/r.height*100)+'%');},{passive:true});
 $('#dock').addEventListener('click',e=>{
  const b=e.target.closest('[data-scene]');if(!b)return;
  if(MODE!=='explore'||DLG.active||panelOpen()||inspectOpen())return;
  RENDER.enterScene(b.dataset.scene);
 });
 const tool=(id,kind)=>$('#'+id).addEventListener('click',()=>{if(MODE==='title')return;if(panelOpen()&&PANEL.kind===kind){closePanel();return;}openPanel(kind,{});});
 tool('bEv','ev');tool('bPeople','people');tool('bTl','tl');tool('bLog','log');tool('bHint','hint');tool('bAcc','acc');tool('bMenu','menu');
 $('#panel').addEventListener('click',e=>{
  if(e.target.id==='panel'){closePanel();return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=PANELACT[t.dataset.act];if(f)f(t.dataset,t);
 });
 $('#inspect').addEventListener('click',e=>{
  const t=e.target.closest('[data-iact]');
  if(!t&&e.target.id!=='inspect')return;
  const act=t?t.dataset.iact:'close';
  $('#inspect').classList.remove('show');
  if(act==='cmp'){const id=t.dataset.id;openPanel('ev',{tab:'c',cmp:[id,null]});}
  const pb=PENDING_BANNERS.shift();PENDING_BANNERS=[];if(pb)RENDER.banner(pb[0],pb[1]);
  RENDER.updateHot();
  if(act!=='cmp')runQueue();
 });
 $('#title').addEventListener('click',e=>{
  const cc=e.target.closest('[data-case]');
  if(cc){pickCase(cc.dataset.case,cc.dataset.mode);return;}
  const t=e.target.closest('[data-t]');if(!t)return;
  if(t.dataset.t==='start')showCaseSelect('play');
  else if(t.dataset.t==='file')showCaseSelect('file');
  else if(t.dataset.t==='back')showTitle();
  else endScreen();
 });
 $('#result').addEventListener('click',e=>{
  const t=e.target.closest('[data-r]');if(!t)return;
  if(t.dataset.r==='again')ACTIONS.restart();else showTitle();
 });
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   if($('#modal').classList.contains('show')){$('#modal').classList.remove('show');$('#modal').onclick=null;}
   else if(inspectOpen()){$('#inspect').click();}
   else if(panelOpen())closePanel();
   return;
  }
  if(MODE!=='title'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
   if(e.key==='m'||e.key==='M'){$('#bSnd').click();return;}
   if((e.key==='a'||e.key==='A')&&DLG.active){setAuto(!AUTO);return;}
   if((e.key==='l'||e.key==='L')){showHist();return;}
  }
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&DLG.active&&!panelOpen()&&!$('#modal').classList.contains('show')){e.preventDefault();advance();}
 });
 window.addEventListener('resize',RENDER.fit);
}
function lightning(){
 const f=$('#flash');
 const go=()=>{
  if(MODE!=='title'&&!document.hidden&&D.weather==='rain'){
   const seq=[.45,0,.6,0,.25,0];let i=0;SND.sfx('thunder');
   const t=setInterval(()=>{f.style.opacity=seq[i++];if(i>=seq.length){clearInterval(t);f.style.opacity=0;}},90);
  }
  setTimeout(go,5000+Math.random()*7000);
 };
 setTimeout(go,4000);
}
function boot(){
 try{
  RENDER.weather();
  RENDER.fit();bindAll();lightning();showTitle();
 }catch(err){
  console.error(err);
  document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:999;background:#05070d;color:#fff;padding:30px">遊戲啟動失敗：'+esc(err.message)+'</div>');
 }
}
window.addEventListener('load',boot);
</script>
</body>
</html>
